name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart analyze
      - run: flutter test
      - run: flutter pub get
        working-directory: example
      - run: dart analyze
        working-directory: example

  publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: |
          echo "=== git status ==="
          git status
          echo "=== git diff (fails on purpose if non-empty, to surface it) ==="
          git diff --exit-code -- analysis_options.yaml example/analysis_options.yaml
      - run: dart pub publish --dry-run
